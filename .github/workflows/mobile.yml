# Builds the native apps. Android: debug APK on every change (install directly on a phone), plus a signed
# release APK + Play Store AAB when the signing secrets exist. iOS: compiles for the simulator to verify the
# project (installing on iPhones needs an Apple Developer account + signing, see README).
name: Mobile apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'android/**', 'ios/**', 'capacitor.config.ts', 'package*.json', '.env.production', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['android/**', 'ios/**', 'capacitor.config.ts', 'src/lib/native.ts', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the APK as a GitHub Release (stable public download link)
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shadowhunt-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK as the "android-latest" release
        # main builds and manual runs get a direct, login-free link:
        # https://github.com/<owner>/<repo>/releases/download/android-latest/ShadowHuntPro.apk
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ShadowHuntPro.apk
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest ShadowHuntPro.apk --target "$GITHUB_SHA" --prerelease \
            --title "ShadowHunt Pro for Android (build ${VERSION_NAME})" \
            --notes "Latest Android build from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Download **ShadowHuntPro.apk** below, open it on your phone and allow installing from this source. Debug-signed test build — not from the Play Store."
      - name: Signed release (only when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets; skipping release build"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shadowhunt-pro-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compile for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -50
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Zip simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/ShadowHuntPro-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with: { name: shadowhunt-pro-ios-simulator, path: ShadowHuntPro-simulator.zip }
