# Deploys the PWA to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
# Supabase URL + publishable key come from .env.production; repo secrets of the same name override them.
name: Deploy PWA to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.ts', '.env.production', '.github/workflows/deploy-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # only override .env.production when the secrets are actually set (empty env vars would win otherwise)
          [ -n "$SECRET_URL" ] && export VITE_SUPABASE_URL="$SECRET_URL"
          [ -n "$SECRET_KEY" ] && export VITE_SUPABASE_ANON_KEY="$SECRET_KEY"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
