# Keeps the free Supabase project from being paused for inactivity (Supabase pauses free projects after
# ~7 days without requests). Calls the harmless public ping() function once a day.
name: Keep backend alive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          set -a; . ./.env.production; set +a
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
